# اختیاری: Deploy روی GitHub Pages. فایل‌های vendor/ (XLSX و Lucide) هنگام Deploy دانلود می‌شوند تا وابستگی به CDN حذف شود.
# اگر دانلود شکست بخورد، برنامه همچنان با fallback به CDN کار می‌کند.
name: deploy-pages
on:
  workflow_run: { workflows: ["update-manifest"], types: [completed] }
  push: { branches: [main], paths-ignore: ["data/manifest.json"] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/build-manifest.mjs
      - run: node tools/fetch-vendor.mjs || echo "vendor fetch failed; CDN fallback will be used"
      - run: node tools/build-pwa.mjs   # Precache/BUILD سرویس‌ورکر (بعد از vendor)
      - run: node tools/check-imports.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
